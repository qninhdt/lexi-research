# DVC parameters. Tracked in Git, hashed into every stage's signature, so a
# changed value invalidates exactly the artifacts that depended on it.
#
# The source path is deliberately absent: it is a local absolute path that
# differs per machine, so it is read from LEXI_SOURCE_DB at stage runtime and
# the pipeline's identity rests on the SHA-256 recorded in source-manifest.json.

export:
  # A definition shorter than this carries no gradable meaning.
  min_definition_chars: 3

sample:
  seed: 20260729
  # Sentences per sense per call. Fixed at 6 project-wide: larger batches raise
  # intra-batch correlation and push call 2 further from single-item inference.
  k: 6
  # Senses drawn for the pilot, and for the full run.
  pilot_senses: 84
  full_senses: 3400
  # Sampling weight per requested meaning band. Weighted toward the middle:
  # unweighted, the teacher writes either clean sentences or nonsense and the
  # bands real learners occupy stay empty.
  meaning_weights:
    "0": 1
    "1": 3
    "2": 3
    "3": 3
    "4": 2
  error_spec_weights:
    none: 2
    one: 3
    few: 3
    many: 2
    unreadable: 1
  # Share of sampled senses that are multiword targets (idiom, phrasal verb,
  # collocation, phrase). They are ~11% of the pool; over-sampling slightly so
  # Phase 8 can report them separately with a usable sample size.
  multiword_share: 0.15

generate:
  # Batches below this distinct-2 score are flagged in the generation report.
  min_distinct2: 0.7

label:
  # Texts re-graded blind to measure teacher self-consistency (pilot gate G1).
  self_consistency_sample: 200

validate:
  # Rejection rate above this means the prompt or schema is at fault, not the data.
  max_reject_rate: 0.10

balance:
  # Cap on any one (meaning, error bucket) stratum, as a share of the dataset.
  max_stratum_share: 0.15

split:
  version: v1
  seed: 20260729
  train: 0.8
  val: 0.1
  test: 0.1

calibrate:
  # Target share of rows in each band, used to place the threshold cut points.
  # Uniform: no band should be so rare the student never learns it.
  target: uniform
  seed: 20260729

train:
  # Any causal-LM checkpoint. Nothing in this section names an architecture:
  # LoRA targets are resolved from the loaded model's own module tree and the
  # chat format from its own tokenizer template, so switching base model is a
  # value change here rather than a code change.
  base_model: Qwen/Qwen3.5-4B
  # The rubric in the grader system prompt is long: a rendered example measures
  # ~1250 whitespace tokens before subword splitting, so the previous 1024 would
  # have dropped every row. Headroom here covers a subword tokenizer, a longer
  # learner sentence, and a reasoning block.
  max_seq_len: 4096
  # Rows over the limit are dropped, and dropping is length-biased. Past this
  # share the remaining data is a different distribution, so the run stops.
  max_drop_fraction: 0.02
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  learning_rate: 1.0e-4
  epochs: 2
  per_device_batch_size: 4
  grad_accum: 8
  warmup_ratio: 0.03
  seed: 20260729
  logging_steps: 10
  save_steps: 100
  gradient_checkpointing: true
  # Stop after this many optimiser steps; 0 runs the full `epochs`. The smoke
  # gate sets it to 2.
  max_steps: 0
  load_in_4bit: true
  # `attn` | `attn+mlp` | `all-linear`, or an explicit list of module-name
  # patterns for a stack the layout below misreads. Ablation A6's arms.
  target_modules: all-linear
  # Loss over the answer only. False supervises the prompt too — ablation A7,
  # and the behaviour of the trainer this one replaced.
  completion_only: true
  # Threaded into the chat template. Models with no thinking mode ignore it.
  # Ablation A2.
  enable_thinking: true
  # How to read a decoder stack, as substring matches on one dotted path
  # component each. One set of conventions therefore covers `self_attn`,
  # `linear_attn` and `attn`, or `mlp`, `ffn` and `block_sparse_moe`. An
  # architecture these misread is an edit here, not in the source.
  layout:
    layer_containers: [layers, h, blocks]
    attention_markers: [attn, attention]
    feedforward_markers: [mlp, ffn, feed_forward, experts, moe]
    # MoE routers, matched by exact component name — `gate` is a router,
    # `gate_proj` is not. No preset adapts them: adapting a router perturbs
    # expert assignment. An explicit pattern list reaches them.
    router_markers: [gate, router, shared_expert_gate]
    excluded_markers: [visual, vision_tower, vision_model, image_encoder, audio_tower]

# The CPU acceptance gate: a randomly-initialised model small enough that two
# optimiser steps finish in seconds, over a fixture that carries no
# Cambridge-derived text.
smoke:
  fixture: ops/fixtures/smoke_50.jsonl
  steps: 2
  # The stand-in stack. `architecture` is any model type this transformers
  # install knows; it exists only to be small, and says nothing about the model
  # a real run trains.
  architecture: llama
  hidden_size: 64
  intermediate_size: 128
  layers: 2
  heads: 4
  kv_heads: 2

# Run tracking. `mode: disabled` records nothing and imports nothing, which is
# what CI runs — an offline path nobody exercises is an offline path that rots.
# An `online` run with no WANDB_API_KEY falls back to disabled rather than
# hanging in a login flow on a headless box.
tracking:
  project: lexi-research
  entity: ""
  group: ""
  mode: online
  # The adapter and band_config.json ship as one artifact under this name. A
  # checkpoint without the config that derives its bands is meaningless.
  adapter_artifact: lexi-grader-adapter

eval:
  max_new_tokens: 256
  temperature: 0.0
