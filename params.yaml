# DVC parameters. Tracked in Git, hashed into every stage's signature, so a
# changed value invalidates exactly the artifacts that depended on it.
#
# The source path is deliberately absent: it is a local absolute path that
# differs per machine, so it is read from LEXI_SOURCE_DB at stage runtime and
# the pipeline's identity rests on the SHA-256 recorded in source-manifest.json.

export:
  # A definition shorter than this carries no gradable meaning.
  min_definition_chars: 3

sample:
  seed: 20260729
  # Sentences per sense per call. Fixed at 6 project-wide: larger batches raise
  # intra-batch correlation and push call 2 further from single-item inference.
  k: 6
  # Senses drawn for the pilot, and for the full run.
  pilot_senses: 84
  full_senses: 3400
  # Sampling weight per requested meaning band. Weighted toward the middle:
  # unweighted, the teacher writes either clean sentences or nonsense and the
  # bands real learners occupy stay empty.
  meaning_weights:
    "0": 1
    "1": 3
    "2": 3
    "3": 3
    "4": 2
  error_spec_weights:
    none: 2
    one: 3
    few: 3
    many: 2
    unreadable: 1
  # Share of sampled senses that are multiword targets (idiom, phrasal verb,
  # collocation, phrase). They are ~11% of the pool; over-sampling slightly so
  # Phase 8 can report them separately with a usable sample size.
  multiword_share: 0.15

generate:
  # Batches below this distinct-2 score are flagged in the generation report.
  min_distinct2: 0.7

label:
  # Texts re-graded blind to measure teacher self-consistency (pilot gate G1).
  self_consistency_sample: 200

validate:
  # Rejection rate above this means the prompt or schema is at fault, not the data.
  max_reject_rate: 0.10

balance:
  # Cap on any one (meaning, error bucket) stratum, as a share of the dataset.
  max_stratum_share: 0.15

# Stage A: the human-annotated learner corpus, converted rather than generated.
# Costs nothing and supplies ~20x the rows of the teacher-graded set, but carries
# no `meaning` and no `feedback` — a general learner corpus has no target sense —
# so it teaches the markup and the tag set only.
gec:
  seed: 20260729
  # Cap per edit-count bucket. Measured: 32.6% of W&I sentences need no edit at
  # all, and a sentence re-emitted verbatim is the cheapest thing a model can
  # learn. At 0.15 the four buckets come out level and ~20k rows survive.
  #
  # The key is the bucket alone. Adding `cefr` was measured and does nothing:
  # twelve strata, none reaching the cap, 105 of 33,081 rows removed.
  max_stratum_share: 0.15
  # No test split. What the project reports is measured on the teacher-graded
  # test set, whose prompt and label set are the ones actually served.
  val_share: 0.05
  # W&I is essays split into sentences, and the split leaves headings, names and
  # sign-offs behind — 2.6% of rows, 83% of them needing no edit. They are not
  # sentences, and they would spend the `clean` budget on echoing proper nouns.
  min_words: 3
  # Conversion below this means the mapping or the detokenisation regressed, not
  # that the corpus changed. Measured at 0.988 on W&I+LOCNESS v2.1.
  min_conversion_rate: 0.95

split:
  version: v1
  seed: 20260729
  train: 0.8
  val: 0.1
  test: 0.1

calibrate:
  # Target share of rows in each band, used to place the threshold cut points.
  # Uniform: no band should be so rare the student never learns it.
  target: uniform
  seed: 20260729

train:
  # Any causal-LM checkpoint. Nothing in this section names an architecture:
  # LoRA targets are resolved from the loaded model's own module tree and the
  # chat format from its own tokenizer template, so switching base model is a
  # value change here rather than a code change.
  base_model: Qwen/Qwen3.5-4B
  # The rubric in the grader system prompt is long, and it grew when the grader
  # was taught the reconstruction and band-separation rules that took format
  # validity from 0.86 to 0.96. Measured over the 467-row pilot with the real
  # Qwen tokenizer: prompt + answer is median 2020, p95 2085, max 2141 tokens.
  # 2048 dropped 86 of those rows; 2560 drops none and leaves room for a longer
  # learner sentence.
  #
  # Batches are padded to their own longest row, not to this limit, so raising it
  # does not slow a typical batch. What it does is bound the worst case: one
  # 4k-token outlier would otherwise stretch every sequence batched with it to 4k.
  # `max_drop_fraction` below is the guard — if a corpus ever needs more than
  # this, the run stops rather than quietly training on the short rows.
  #
  # The sequences themselves did get ~1.34x longer than the old prompt's 1503
  # median, which is real training cost paid for the validity gain.
  max_seq_len: 2560
  # Rows over the limit are dropped, and dropping is length-biased. Past this
  # share the remaining data is a different distribution, so the run stops.
  max_drop_fraction: 0.02
  # Rank 8 with alpha 32 follows the current ms-swift dense Qwen3.5 recipe, and
  # cuts the adapter and its optimizer state relative to the rank 32 this
  # replaced. Alpha tracks rank at 4x so the LoRA scaling (alpha / r) stays put;
  # changing rank alone would also change the effective update size and confound
  # a rank comparison with a learning-rate one.
  #
  # This is a capacity decision, not a free speed win: if format validity or
  # meaning agreement drops against a rank 32 arm on the real corpus, rank is
  # the first thing to put back. Ablation A6 varies `target_modules`, and this
  # value belongs to the same family of questions.
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 1.0e-4
  epochs: 2
  # Effective batch is the product of these two, and is what the learning rate
  # was chosen against; change one and the other must absorb it.
  #
  # This default is the one that fits the *tighter* of the two target models.
  # Measured on a Colab L4 (22 GiB), 2 optimiser steps over 64 sequences,
  # text-only QLoRA:
  #
  #   Qwen3.5-4B     batch 4  ->  9.5 GiB peak,  171 s   (fastest)
  #   Qwen3.5-4B     batch 8  -> 13.9 GiB peak,  238 s   (slower again)
  #   Gemma 4 E4B-it batch 1  -> 20.6 GiB peak,  220 s
  #   Gemma 4 E4B-it batch 4  -> out of memory
  #
  # Gemma 4 E4B-it has almost no headroom left at batch 1, so a global default
  # above 1 would break it. `run_colab_train.sh` raises the batch for Qwen,
  # where the same effective batch of 32 is reached with accumulation 8 and
  # measurably less wall-clock. Raise this only for a model verified to fit.
  per_device_batch_size: 1
  grad_accum: 32
  warmup_ratio: 0.03
  seed: 20260729
  logging_steps: 10
  save_steps: 100
  # Native PyTorch SDPA uses the L4's fused attention kernels on the model's
  # full-attention blocks. Linear-attention blocks keep their own fused path.
  attn_implementation: sdpa
  # `auto` selects fused AdamW on CUDA and the portable implementation on CPU.
  # This changes kernel fusion only; the optimizer update and hyperparameters
  # remain the same.
  optimizer: auto
  # Disabled by default: this is an optional A/B because Inductor compilation
  # can cost substantial startup time and VRAM on QLoRA + checkpointing.
  torch_compile: false
  torch_compile_backend: null
  torch_compile_mode: null
  # Qwen's causal-LM head accepts `logits_to_keep`; this projects only the
  # completion window while preserving the exact completion-only CE objective.
  selective_logits: true
  # Fused RMSNorm/SwiGLU/RoPE and a chunked cross-entropy from Liger. The
  # attraction here is the head: a 248,320-entry vocabulary over hidden size
  # 2560 makes the logit projection and its softmax a large share of both time
  # and memory. Off by default until measured on this exact stack, because Liger
  # patches modules in place and this trainer computes its own completion-only
  # CE — a fused loss that ignored `logits_to_keep` would silently change the
  # objective rather than just the speed.
  use_liger_kernel: false
  # In-loop evaluation interval. Loss falls smoothly while format validity
  # collapses, so the harness runs during training rather than after it. 0 is off.
  eval_steps: 200
  # Rows scored in loop. Fixed and small, and fixed across arms — an ablation
  # whose arms were scored on different rows is not an ablation.
  eval_subset: 32
  gradient_checkpointing: false
  # Non-reentrant checkpointing is lower-overhead on current PyTorch, but keep

  # the switch explicit so a timing ablation can reject it if backward is slower.
  gradient_checkpointing_use_reentrant: false
  # Group samples of similar length into the same batch to minimize padding overhead.
  group_by_length: false
  # Stop after this many optimiser steps; 0 runs the full `epochs`. The smoke

  # gate sets it to 2.
  max_steps: 0
  load_in_4bit: true
  # The dataset is text-only. Keep the model's language stack and discard the
  # unused vision/audio towers after loading; set false only for multimodal data.
  text_only: true
  # Nested quantisation saves a little VRAM but adds dequantisation work. L4 has
  # enough headroom for the faster single-quant path.
  bnb_4bit_use_double_quant: false
  # Ampere+ cards such as L4 can use TF32 for the remaining fp32 matmuls.
  tf32: true
  # Pretokenised examples make worker prefetch useful on a GPU; the launcher
  # raises this to 2 for L4 while CPU smoke keeps the portable value of 0.
  dataloader_num_workers: 0
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 2
  # `attn` | `attn+mlp` | `all-linear`, or an explicit list of module-name
  # patterns for a stack the layout below misreads. Ablation A6's arms.
  target_modules: all-linear
  # Loss over the answer only. False supervises the prompt too — ablation A7,
  # and the behaviour of the trainer this one replaced.
  completion_only: true
  # Which supervised task, and therefore which collator and which prompt.
  #
  # `grader`    stage B: the three-field answer behind the prompt that is served.
  # `corrector` stage A: the correction alone, from a human-annotated learner
  #             corpus that has no target sense and so no meaning and no
  #             feedback. Its prompt is ~28% shorter, which over ~19k rows is
  #             the difference between a run that fits an L4 session and one
  #             that does not.
  #
  # Stage A must run without `--val`: in-loop evaluation decodes through the
  # grader prompt and scores three fields, and the trainer refuses rather than
  # scoring stage-A rows against a contract they do not carry.
  task: grader
  # How much of the tag set the stage-A prompt explains. `full` documents all 16;
  # `terse` names them and lets ~19k examples teach what each means.
  #
  # Not a style choice. Measured with the Qwen tokenizer over 2,000 rows: the
  # learner sentence averages 14 tokens and the answer 14, while the full rubric
  # is 915 — so 97% of every sequence is a prompt supplied verbatim at inference,
  # and only 1.5% of tokens carry loss. At the L4 rate in the README that is
  # ~17 hours for `full` against ~1 for `terse`. Ignored when `task: grader`.
  rubric: full
  # Ablation A2: `on`, `off`, or `forced-empty`. The third arm keeps the
  # template's reasoning path open but supervises an empty block, which is what
  # separates "reasoning helps" from "the scaffold alone helps". Quoted: YAML
  # reads a bare `on` as the boolean true.
  # Keep the reasoning path used by the model and the ablation design. Speed
  # optimisations must not replace this with a smaller objective.
  thinking: "on"
  # How to read a decoder stack, as substring matches on one dotted path
  # component each. One set of conventions therefore covers `self_attn`,
  # `linear_attn` and `attn`, or `mlp`, `ffn` and `block_sparse_moe`. An
  # architecture these misread is an edit here, not in the source.
  layout:
    layer_containers: [layers, h, blocks]
    attention_markers: [attn, attention]
    feedforward_markers: [mlp, ffn, feed_forward, experts, moe]
    # MoE routers, matched by exact component name — `gate` is a router,
    # `gate_proj` is not. No preset adapts them: adapting a router perturbs
    # expert assignment. An explicit pattern list reaches them.
    router_markers: [gate, router, shared_expert_gate]
    excluded_markers: [visual, vision_tower, vision_model, image_encoder, audio_tower]

# The CPU acceptance gate: a randomly-initialised model small enough that two
# optimiser steps finish in seconds, over a fixture that carries no
# Cambridge-derived text.
smoke:
  fixture: ops/fixtures/smoke_50.jsonl
  steps: 2
  # The stand-in stack. `architecture` is any model type this transformers
  # install knows; it exists only to be small, and says nothing about the model
  # a real run trains.
  architecture: llama
  hidden_size: 64
  intermediate_size: 128
  layers: 2
  heads: 4
  kv_heads: 2

# Run tracking. `mode: disabled` records nothing and imports nothing, which is
# what CI runs — an offline path nobody exercises is an offline path that rots.
# An `online` run with no WANDB_API_KEY falls back to disabled rather than
# hanging in a login flow on a headless box.
tracking:
  project: lexi-research
  entity: ""
  group: ""
  mode: online
  # The adapter and band_config.json ship as one artifact under this name. A
  # checkpoint without the config that derives its bands is meaningless.
  adapter_artifact: lexi-grader-adapter

# The inference lab. VRAM is a parameter, never an assumption: any arm that
# only works on one card is a defect in the harness rather than a fact about the
# hardware.
bench:
  engine: hf
  # Open-loop arrival rate, per concurrency level. Requests are issued on a fixed
  # schedule, not after the previous response — a closed-loop generator with a
  # fixed worker count silently backs off as the server slows and never shows a
  # saturation knee.
  concurrency: [1, 4, 16, 64, 128]
  duration_s: 60
  warmup_requests: 20
  # Goodput is measured against this. Throughput counts work done; goodput counts
  # work that arrived in time to be useful.
  slo_s: 2.0
  # For cost per 1000 requests. Zero means unknown, which reports as absent
  # rather than as free.
  cost_per_hour: 0.0
  quantisations: [bf16, fp8, awq, gptq]
  repeat_runs: 2

# Reinforcement learning. All three tracks share this section; they differ only
# in how R(z) is defined, which is what makes a comparison between them a
# comparison of reward definitions rather than of trainers.
rl:
  # `grpo` | `jepo` | `nrt`. Order is not negotiable: GRPO's reward is exogenous,
  # so when a curve misbehaves the cause is the trainer or the data. JEPO and NRT
  # rewards are functions of theta, and a rising reward there can mean the model
  # became more confident rather than more correct.
  algo: grpo
  # Rollouts sampled per prompt. The group is what advantages are relative to, so
  # a group of one carries no signal at all.
  group_size: 4
  # Weight on the RL term in `CE + lambda * L_RL`. Swept on the 50-row fixture
  # before any full run, per track: there is no reason the three should agree.
  lambda_rl: 0.1
  # Logged every step, never optimised. An endogenous reward can rise while the
  # policy walks away from anything the reference would recognise.
  kl_coefficient: 0.0
  # Ablation A3. `full_answer` adds feedback to the reward, which the design
  # argues teaches the model to chase teacher phrasing; this arm tests that.
  reward_scope: correction_meaning
  # Ablation A4, NRT only.
  nrt_aggregation: geo_mean
  # `max(0, R(z) - R(empty))`. Mandatory for JEPO and NRT, and the primary
  # diagnostic for both: a gap that collapses to zero means reasoning stopped
  # contributing, whatever the reward curve says.
  empty_baseline: true
  max_reasoning_tokens: 256
  temperature: 1.0
  reward_weights:
    edit_f1: 0.5
    meaning: 0.3
    format_valid: 0.2
    # Above the whole positive total on purpose: at 0.5 an otherwise-perfect
    # answer that quietly rewrote unmarked text still scored positive, which
    # makes the behaviour worth producing.
    strip_mismatch: 1.0

eval:
  max_new_tokens: 256
  temperature: 0.0
  # Rows decoded per `generate` call. Prompts are left-padded into one batch, so
  # the batch decodes for as long as its slowest row needs while paying prefill
  # and kernel-launch cost once instead of once per row. Measured on an L4 over
  # 16 fixture rows: 208 s at 1, 39 s at 8. This is what makes the in-loop eval
  # cheap enough to leave switched on.
  #
  # Batch size changes bf16 reduction order, so a greedy completion can drift
  # token-for-token from a serial one (measured: 5/8 rows identical, 8/8 parsing
  # to the same answer JSON). Set this to 1 when byte-stable `raw` text matters
  # more than speed.
  batch_size: 8
  # One retry on an invalid answer. The count lands in the report: a student that
  # needs two attempts is a different product than one that needs none.
  max_retries: 1
  # Equal-mass, not equal-width. The band distribution is skewed by design, so
  # equal-width bins would leave several nearly empty and ECE would be noise.
  calibration_bins: 10
  # Pairs sampled for the teacher-as-judge feedback comparison. Both orders of
  # each pair are presented, so this costs twice as many calls.
  judge_sample: 100
