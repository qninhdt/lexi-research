[project]
name = "tau-research"
version = "0.1.0"
description = "Specialized Business Customer-Service Assistant via SFT to Agentic RL on tau3-bench Retail"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "qninhdt", email = "qndt123@gmail.com" }]
dependencies = [
    "accelerate>=1.0",
    "datasets>=3",
    "jinja2>=3.1",
    "json-repair>=0.63.1",
    "peft>=0.14",
    "pydantic>=2.9",
    "pyyaml>=6",
    "rich>=13.0",
    "torch>=2.4.0",
    "transformers>=4.48",
    "trl>=0.12",
    "wandb>=0.18",
    "tau2",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[project.optional-dependencies]
colab = [
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "causal-conv1d @ https://github.com/astral-sh-build/build-causal-conv1d/releases/download/v1.6.2.post1-r2/causal_conv1d-1.6.2.post1%2Bcu.12.8.torch.2.11-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux'",
    "datasets>=3",
    "flash-attn @ https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.11/flash_attn-2.8.3%2Bcu12torch2.11cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux'",
    "flash-linear-attention",
    "peft>=0.14",
    # Upper bound keeps every prebuilt kernel wheel consistent: the
    # flash-attn fork and astral-sh causal-conv1d wheel below are compiled
    # against torch 2.11 + CUDA 12.8; a newer torch breaks their ABI.
    "torch>=2.11.0,<2.12",
    "torchvision>=0.16,<0.27",
    "torchaudio",
    "torchaudio",
    "transformers>=4.48",
    "trl>=0.12",
    "wandb",
]
serve = ["fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
tau-research = "tau_research.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "types-PyYAML>=6",
]
smoke = [
    "accelerate>=1.0",
    "datasets>=3",
    "peft>=0.14",
    "torch>=2.4.0",
    "transformers>=4.48",
    "trl>=0.12",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tau_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_subclassing_any = false
files = ["src/tau_research", "tests"]

[[tool.mypy.overrides]]
module = [
    "accelerate.*",
    "bitsandbytes.*",
    "datasets.*",
    "peft.*",
    "tokenizers.*",
    "torch.*",
    "tqdm.*",
    "transformers.*",
    "trl.*",
    "vllm.*",
    "wandb.*",
    "tau2.*",
]
ignore_missing_imports = true
follow_imports = "skip"
