# A2 — thinking. `forced-empty` is what makes the other two interpretable: a win
# for `on` over `off` could mean reasoning helps, or that the scaffold alone
# shifts the distribution the answer is sampled from.
#
# Report tokens generated per request alongside quality. Reasoning that buys
# 0.01 QWK for four times the tokens is a loss for this task.
key: a2
question: Is reasoning worth its token cost for a task whose rubric is supplied?
arms:
  - name: a2-on
    overrides:
      train.thinking: "on"
  - name: a2-off
    overrides:
      train.thinking: "off"
  - name: a2-forced-empty
    overrides:
      train.thinking: forced-empty
