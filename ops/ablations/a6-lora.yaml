# A6 — LoRA placement and rank. Widest sweep, so it runs last with A7 and A2
# settled. Rank 32 is the default and is already measured by the first real run,
# so the grid covers 8 and 64.
#
# Role-resolved placement on a hybrid linear-attention stack has no prior art.
# Report trainable-parameter count and peak VRAM next to quality: the interesting
# result may be equal quality at fewer parameters rather than higher quality.
key: a6
question: Where should LoRA attach on this architecture, and at what rank?
grid:
  train.target_modules: [attn, attn+mlp, all-linear]
  train.lora_r: [8, 64]
arms:
  # The list the trainer carried before Phase 0. Not a preset — an explicit
  # pattern list — because its whole point is to be the wrong thing to do on a
  # stack whose projections are named otherwise. This arm is what turns "the old
  # target list was a bug" from an assertion into a number.
  - name: a6-legacy-name-list
    overrides:
      train.target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
      train.lora_r: 32
