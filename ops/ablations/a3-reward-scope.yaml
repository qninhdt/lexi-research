# A3 — reward mask. Tests the design's §3 claim directly: that rewarding feedback
# teaches the model to chase the teacher's phrasing rather than its grading.
#
# No prior art, because the claim is specific to this output schema. Run on GRPO,
# whose reward is exogenous, so the difference is attributable to the scope
# rather than to a reward that moved under the policy.
key: a3
question: Does rewarding unverifiable feedback hurt the verifiable fields?
arms:
  - name: a3-correction-meaning
    overrides:
      rl.algo: grpo
      rl.reward_scope: correction_meaning
  - name: a3-full-answer
    overrides:
      rl.algo: grpo
      rl.reward_scope: full_answer
