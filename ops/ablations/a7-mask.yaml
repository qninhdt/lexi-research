# A7 — loss mask. Run first: it is the cheapest arm and it validates the Phase 0
# fix on real data. The completion is ~3% of the sequence, so if supervising the
# other 97% is not measurably worse, the mask is not doing what it claims and the
# finding is about the mask rather than about the loss.
key: a7
question: >-
  How much does supervising the prompt cost, when the prompt is 97% of the
  sequence and is supplied verbatim at inference?
arms:
  - name: a7-completion-only
    overrides:
      train.completion_only: true
  - name: a7-full-sequence
    overrides:
      train.completion_only: false
