# The pipeline. Every artifact is reproducible from the pinned source plus the
# code and params hashed into each stage's signature.
#
# Every `cmd` is a `lexi` subcommand — the same command a human types. A stage
# that cannot be expressed as one means the CLI is incomplete, and the fix is the
# CLI rather than a `python -m` path here.
#
# `LEXI_SOURCE_DB` is read from the environment rather than params.yaml: the
# source is a local absolute path, and a tracked file holding it would make the
# pipeline machine-specific. Determinism rests on the SHA-256 that
# source-manifest.json records instead.
#
# `generate` and `label` reach a teacher endpoint and cost money; they are
# declared here so lineage is complete, and never run in CI. `lexi smoke`
# substitutes a fixture for both.

stages:
  export:
    cmd: >-
      uv run lexi data export
      --source "$LEXI_SOURCE_DB"
      --out data/pool
      --profiles lexi_research/data/profiles.json
      --min-rows 180000
    deps:
      - lexi_research/data/cli.py
      - lexi_research/data/export.py
      - lexi_research/data/pos_normalize.py
      - lexi_research/data/profiles.json
    params:
      - export
    outs:
      # Cambridge-derived text: private, pushed to R2, never Git.
      - data/pool/senses_pool.parquet
      - data/pool/quarantine.parquet
    # Counts and hashes only — no dictionary text — so these stay in Git as the
    # provenance record a result can be traced back to.
    metrics:
      - data/pool/data-quality.json:
          cache: false
      - data/pool/source-manifest.json:
          cache: false

  sample:
    cmd: uv run lexi data sample --pool data/pool/senses_pool.parquet --out data/batches
    deps:
      - data/pool/senses_pool.parquet
      - lexi_research/data/sample_batches.py
      - lexi_research/data/profiles.py
      - lexi_research/data/profiles.json
      - lexi_research/data/stages.py
    params:
      - sample
    outs:
      - data/batches/batch_specs.parquet
    metrics:
      - data/batches/sample-report.json:
          cache: false

  generate:
    cmd: uv run lexi data generate --specs data/batches/batch_specs.parquet --out data/raw
    deps:
      - data/batches/batch_specs.parquet
      - lexi_research/data/generate.py
      - lexi_research/data/diversity.py
      - lexi_research/data/stages.py
      - lexi_research/teacher/prompts/diversify_system.jinja
      - lexi_research/teacher/prompts/diversify_user.jinja
    params:
      - generate
    outs:
      - data/raw/raw_texts.parquet
    metrics:
      - data/raw/generate-report.json:
          cache: false

  label:
    cmd: uv run lexi data label --texts data/raw/raw_texts.parquet --out data/raw
    deps:
      - data/raw/raw_texts.parquet
      - lexi_research/data/label.py
      - lexi_research/data/stages.py
      - lexi_research/format/validate.py
      - lexi_research/teacher/prompts/grader_system.jinja
      - lexi_research/teacher/prompts/grader_user.jinja
    params:
      - label
    outs:
      - data/raw/raw_labels.parquet
    metrics:
      - data/raw/label-report.json:
          cache: false

  process:
    # Validation, balancing and splitting are one transformation: nothing
    # consumes the intermediates, and the report already breaks out reject
    # reasons, the distribution before and after balancing, and the leak check.
    cmd: >-
      uv run lexi data process
      --texts data/raw/raw_texts.parquet
      --labels data/raw/raw_labels.parquet
      --out data/clean
    deps:
      - data/raw/raw_texts.parquet
      - data/raw/raw_labels.parquet
      - band_config.json
      - lexi_research/data/process.py
      - lexi_research/data/balance.py
      - lexi_research/data/split.py
      - lexi_research/data/stages.py
    params:
      - balance
      - split
      - validate
    outs:
      - data/clean/processed.parquet
      - data/clean/rejects.parquet
      - data/clean/train.parquet
      - data/clean/val.parquet
      - data/clean/test.parquet
      - data/clean/test_strict.parquet
    metrics:
      - data/clean/data-quality.json:
          cache: false

  calibrate:
    # Seeds from the design guesses in `band_config.json` — tracked in Git,
    # `calibrated: false` — and writes the calibrated copy as a pipeline
    # artifact. Two files rather than one so the seed stays a dependency of
    # `process` without the pipeline forming a cycle; the calibrated copy is what
    # ships with a checkpoint.
    cmd: >-
      uv run lexi data calibrate
      --rows data/clean/train.parquet
      --out data/clean/band_config.json
    deps:
      - data/clean/train.parquet
      - band_config.json
      - lexi_research/data/stages.py
      - lexi_research/eval/calibrate.py
      - lexi_research/format/bands.py
    params:
      - calibrate
    outs:
      - data/clean/band_config.json:
          cache: false
    metrics:
      - data/clean/calibrate-report.json:
          cache: false

  sft:
    cmd: >-
      uv run lexi train sft
      --train data/clean/train.parquet
      --band-config data/clean/band_config.json
      --output runs/sft/adapter
    deps:
      - data/clean/train.parquet
      - data/clean/band_config.json
      - lexi_research/train/trainer.py
      - lexi_research/train/collate.py
      - lexi_research/train/modules.py
    params:
      - train
      - tracking
    outs:
      - runs/sft/adapter

  predict:
    # The only step here that needs a GPU. Split from scoring so a metric fix
    # never costs a re-run of the model.
    cmd: >-
      uv run lexi eval predict
      --rows data/clean/test.parquet
      --adapter runs/sft/adapter
      --band-config data/clean/band_config.json
      --out reports/predictions-sft.jsonl
    deps:
      - data/clean/test.parquet
      - data/clean/band_config.json
      - runs/sft/adapter
      - lexi_research/eval/predict.py
    params:
      - eval
    outs:
      - reports/predictions-sft.jsonl

  eval:
    cmd: >-
      uv run lexi eval score
      --predictions reports/predictions-sft.jsonl
      --ceiling reports/pilot-ceiling.json
      --band-config data/clean/band_config.json
      --split test
      --out reports/eval-sft.json
    deps:
      - reports/predictions-sft.jsonl
      - reports/pilot-ceiling.json
      - data/clean/band_config.json
      - lexi_research/eval/harness.py
      - lexi_research/eval/correction.py
      - lexi_research/eval/calibration.py
      - lexi_research/eval/report.py
    params:
      - eval
    metrics:
      - reports/eval-sft.json:
          cache: false
