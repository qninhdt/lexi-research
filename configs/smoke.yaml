mode: "smoke"

model:
  name_or_path: "Qwen/Qwen3.5-2B"
  torch_dtype: "float32"
  enable_thinking: true

sft:
  max_samples: 4
  max_seq_length: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  max_steps: 2
  bf16: false

grpo:
  max_samples: 2
  num_generations: 2
  max_completion_length: 256
  max_steps: 2
  use_vllm: false
  bf16: false

eval:
  max_tasks: 1
  num_trials: 1
  max_agent_turns: 2
