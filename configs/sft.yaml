model:
  name_or_path: "Qwen/Qwen3.5-2B"
  torch_dtype: "bfloat16"
  enable_thinking: true

dataset:
  name: "inclusionAI/AReaL-tau2-data (sft split, retail, correct=1 & reward=1 & thinking non-empty)"
  train_path: "artifacts/data/areal_sft_train.json"
  val_path: "artifacts/data/areal_sft_val.json"
  max_seq_length: 6144

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

training:
  output_dir: "artifacts/models/qwen3.5-2b-tau-retail-sft"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 1
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  max_grad_norm: 1.0
  packing: false
  seed: 42
  bf16: true
  completion_only_loss: true
  report_to: "wandb"

wandb:
  project: "tau-research"
  run_name: "qwen35-2b-sft-retail"
