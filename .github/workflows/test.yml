name: test

# Two jobs. `check` is the fast one: pure functions over synthetic fixtures, no
# training stack at all. `smoke` installs CPU torch and runs the acceptance gate,
# because the defects it catches — a chat template that masks nothing, an adapter
# that attaches to nothing — are invisible to unit tests over stubs.
#
# Neither job spends teacher budget, reaches the network at run time, or touches
# the private Cambridge-derived data. The smoke fixture is synthetic and its
# tokenizer is built from that fixture.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: the package targets >=3.10, and `Tag` back-ports
        # StrEnum behaviour that 3.11+ provides natively, so both must pass.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: ruff
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--group smoke` pulls CPU-only torch wheels; the group is excluded from
      # the job above so the fast checks stay fast.
      - name: Install the CPU training stack
        run: uv sync --locked --group smoke --dev

      - name: smoke
        run: make -f ops/Makefile smoke

      # The tests that need a real tokenizer skip in the `check` job and run here.
      - name: pytest with the training stack
        run: uv run pytest -q

