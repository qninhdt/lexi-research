name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: ruff
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the CPU training stack
        run: uv sync --locked --group smoke --dev

      - name: smoke
        run: make -f ops/Makefile smoke

      - name: pytest with the training stack
        run: uv run pytest -q

  # Optional GPU smoke when a self-hosted CUDA runner is available.
  # Skipped on default GitHub-hosted runners (no NVIDIA GPU).
  smoke-gpu:
    runs-on: ubuntu-latest
    if: ${{ vars.TAU_GPU_SMOKE == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install colab extras (vLLM / flash-attn when available)
        run: uv sync --locked --extra colab --dev
        continue-on-error: true

      - name: GPU smoke
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
            make -f ops/Makefile smoke
          else
            echo "No GPU on runner; structural check only"
            uv run python -c "from tau_research.training.train_grpo import GRPOTrainingConfig, format_rollout_batch_for_grpo; c=GRPOTrainingConfig.from_yaml('configs/grpo.yaml'); b=format_rollout_batch_for_grpo([[1]],[[2]],[1.0]); assert 'logprobs' in b and 'advantages' in b and 'returns' in b"
          fi
